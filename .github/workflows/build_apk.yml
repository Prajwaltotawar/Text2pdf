name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name text_to_pdf_converter .

      - name: Set minSdk 21 (Android 5)
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle
          grep -n "minSdkVersion" android/app/build.gradle

      - name: Fix Kotlin conflict
        run: |
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              constraints {
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.10")
                  implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10")
              }
          }
          EOF
          tail -n 12 android/app/build.gradle

      - name: Download Noto fonts
        run: |
          mkdir -p assets/fonts
          B=https://cdn.jsdelivr.net/gh/notofonts/notofonts.github.io/fonts
          curl -fL $B/NotoSans/hinted/ttf/NotoSans-Regular.ttf -o assets/fonts/NotoSans-Regular.ttf
          curl -fL $B/NotoSansDevanagari/hinted/ttf/NotoSansDevanagari-Regular.ttf -o assets/fonts/NotoSansDevanagari-Regular.ttf
          curl -fL $B/NotoSansTelugu/hinted/ttf/NotoSansTelugu-Regular.ttf -o assets/fonts/NotoSansTelugu-Regular.ttf
          ls -l assets/fonts

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
